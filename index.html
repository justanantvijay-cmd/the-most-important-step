function rollD20() {
  return Math.floor(Math.random() * 20) + 1;
}
function pickDemonType(archetype, stats) {

  if (stats.willpower <= 3) weak.push("Rage", "Shame", "Sadness");
  const pool = [...bias, ...weak, ...ALL_DEMONS];
  return pool[Math.floor(Math.random() * Math.min(pool.length, bias.length + weak.length + 2))];
}
function resolveCombat(demon, response, stats) {
  const fit = FIT[demon.type][response];
  const roll = rollD20();
  const focusBonus = stats.focus >= 7 ? 2 : stats.focus >= 5 ? 1 : 0;
  const willBonus = stats.willpower >= 7 ? 3 : 0;
  const painFloor = stats.painTolerance >= 7;
  const eff = roll + focusBonus + (fit === "primary" ? willBonus : 0);
  let delta, outcome;
  if (fit === "primary") {
    if (eff >= 16) {
      delta = {
        stamina: 1,
        willpower: 1
      };
      outcome = "victory";
    } else if (eff >= 9) {
      delta = {
        stamina: -1
      };
      outcome = "pyrrhic";
    } else {
      delta = {
        stamina: -2
      };
      outcome = "loss";
    }
  } else if (fit === "adjacent") {
    if (eff >= 15) {
      delta = {
        stamina: -1
      };
      outcome = "pyrrhic";
    } else if (eff >= 8) {
      delta = {
        stamina: -2,
        focus: -1
      };
      outcome = "loss";
    } else {
      delta = {
        stamina: -2,
        focus: -1,
        painTolerance: -1
      };
      outcome = "loss";
    }
  } else if (fit === "neutral") {
    if (eff >= 13) {
      delta = {
        stamina: -2,
        focus: -1
      };
      outcome = "loss";
    } else {
      delta = {
        stamina: -2,
        focus: -1,
        painTolerance: -1
      };
      outcome = "brutal";
    }
  } else {
    if (eff >= 18) {
      delta = {
        stamina: -2,
        willpower: -1
      };
      outcome = "loss";
    } else if (eff >= 10) {
      delta = {
        stamina: -2,
        focus: -1,
        willpower: -1
      };
      outcome = "brutal";
    } else {
      delta = {
        stamina: -3,
        focus: -1,
        willpower: -2
      };
      outcome = "brutal";
    }
  }
  if (painFloor && (delta.stamina || 0) < -3) delta = {

    stamina: -3

    fit,
    delta,
    outcome

}

}
